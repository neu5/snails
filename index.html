<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Snails</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10131c; overflow: hidden; }
      body {
        display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif;
        height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      /* Largest 16:9 box that fits the screen. */
      canvas {
        display: block; width: min(100vw, calc(100dvh * 16 / 9)); height: auto;
        image-rendering: auto; box-shadow: 0 0 40px #0008; touch-action: none;
      }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 3; background: #10131cf2; color: #fff;
        align-items: center; justify-content: center; text-align: center; font: bold 20px system-ui, sans-serif;
      }
      @media (orientation: portrait) and (pointer: coarse) { body.playing #rotate { display: flex; } }

      /* Online lobby: a normal scrolling page, unlike the game. */
      #lobby {
        position: fixed; inset: 0; overflow-y: auto; padding: 24px 16px; box-sizing: border-box;
        touch-action: auto; user-select: text; -webkit-user-select: text; color: #e8e6f0;
        background: radial-gradient(circle at 30% 0%, #3d2f5a, #10131c 70%);
        font: 15px/1.45 system-ui, sans-serif;
      }
      #lobby[hidden] { display: none; }
      #lobby .card { max-width: 560px; margin: 0 auto; background: #1b1f2ccc; border: 1px solid #ffffff1a; border-radius: 16px; padding: 20px; }
      #lobby h1 { margin: 0 0 8px; font-size: 24px; }
      #lobby h1 code { font-size: 20px; color: #ffd166; letter-spacing: 1px; }
      #lobby h2 { margin: 20px 0 8px; font-size: 17px; }
      #lobby .muted { color: #a9a6ba; }
      #lobby .small { font-size: 13px; }
      #lobby a { color: #7fd1ff; }
      #lobby .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
      #lobby .row > .field { flex: 1; min-width: 120px; }
      #lobby .field { display: block; margin: 10px 0; }
      #lobby .field > span { display: block; font-size: 13px; color: #c9c6d8; margin-bottom: 4px; }
      #lobby input, #lobby select {
        box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ffffff2a;
        background: #0d1018; color: #fff; font: inherit;
      }
      #lobby input.link { flex: 1; min-width: 0; width: auto; font-size: 14px; }
      #lobby button {
        padding: 10px 16px; border-radius: 10px; border: 1px solid #ffffff33; background: #2a2f40; color: #fff;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      #lobby button.primary { display: block; width: 100%; margin-top: 14px; background: #ff8a3d; border-color: #ff8a3d; color: #1b1205; }
      #lobby button:disabled { opacity: 0.45; cursor: default; }
      #lobby button.small-btn { padding: 6px 10px; font-size: 13px; }
      #lobby .teams { list-style: none; padding: 0; margin: 12px 0; }
      #lobby .teams li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-radius: 10px; background: #ffffff0a; margin-bottom: 6px; }
      #lobby .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
      #lobby .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #ffffff22; }
      #lobby .tag.you { background: #ffd16655; }
      #lobby .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
      #lobby .swatch { width: 38px; height: 38px; padding: 0; border-radius: 50%; border: 3px solid transparent; }
      #lobby .swatch.on { border-color: #fff; }
      #lobby .swatch:disabled { opacity: 0.2; }
      #lobby .snails { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
      #lobby .email-status { color: #ffd166; margin: 4px 0; }
      #lobby .email-status.ok { color: #8fe08f; }
      .toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10; max-width: 90vw;
        background: #1f6f3f; color: #fff; padding: 10px 16px; border-radius: 10px; font: 15px system-ui, sans-serif;
      }
      .toast.err { background: #8a2a2a; }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="rotate">Turn your phone sideways to play ↻</div>
    <div id="lobby" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
